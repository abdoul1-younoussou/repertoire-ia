
name: Surveillance hebdomadaire des liens

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le répertoire
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier et actualiser les liens
        run: python monitor.py

      - name: Enregistrer les résultats
        run: |
          git config user.name 'repertoire-ia-monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html status.json
          git diff --cached --quiet || git commit -m 'Mise à jour hebdomadaire des liens IA'
          git push
          
