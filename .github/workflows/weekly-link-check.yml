
name: Surveillance hebdomadaire des liens

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'monitor.py'
      - 'requirements.txt'
      - '.github/workflows/weekly-link-check.yml'

permissions:
  contents: write

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le repertoire
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier et actualiser les liens
        run: python monitor.py

      - name: Enregistrer les resultats
        run: |
          git config user.name "repertoire-ia-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add index.html status.json
          git diff --cached --quiet || git commit -m "Mise a jour hebdomadaire des liens IA"
          git push
          
